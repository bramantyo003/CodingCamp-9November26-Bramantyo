<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="theme-toggle" class="theme-toggle" type="button">Dark</button>
    </header>

    <main>
      <!-- Total Balance + spending limit -->
      <section id="balance-card" class="card balance-card" aria-labelledby="balance-label">
        <p id="balance-label" class="balance-label">Total Balance</p>
        <p id="total-balance" class="balance-amount" aria-live="polite">$0.00</p>
        <p id="limit-alert" class="limit-alert" role="status" hidden></p>

        <div class="limit-field">
          <label for="limit-input">Spending limit</label>
          <input id="limit-input" type="number" inputmode="decimal" min="0" step="0.01" placeholder="No limit">
          <small>Items and the total above this amount are highlighted.</small>
        </div>
      </section>

      <!-- Input form -->
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="field">
            <label for="item-name">Item Name</label>
            <input id="item-name" type="text" maxlength="60" autocomplete="off" placeholder="e.g. Lunch">
          </div>

          <div class="field">
            <label for="item-amount">Amount</label>
            <input id="item-amount" type="number" inputmode="decimal" min="0.01" max="1000000000" step="0.01" placeholder="0.00">
          </div>

          <div class="field">
            <label for="item-category">Category</label>
            <select id="item-category">
              <option value="" selected disabled>Select category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>

          <p id="form-error" class="form-error" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary">Add Transaction</button>
        </form>
      </section>

      <div class="grid">
        <!-- Transaction list -->
        <section class="card" aria-labelledby="list-title">
          <div class="card-head">
            <h2 id="list-title">Transactions</h2>
            <select id="sort-select" class="sort-select" aria-label="Sort transactions">
              <option value="newest">Newest first</option>
              <option value="amount-desc">Amount: high to low</option>
              <option value="amount-asc">Amount: low to high</option>
              <option value="category">Category (A–Z)</option>
            </select>
          </div>
          <ul id="transaction-list" class="transaction-list"></ul>
          <p id="list-empty" class="empty-state">No transactions yet. Add your first one above.</p>
        </section>

        <!-- Pie chart -->
        <section class="card" aria-labelledby="chart-title">
          <h2 id="chart-title">Spending by Category</h2>
          <div id="chart-wrap" class="chart-wrap" hidden>
            <canvas id="spending-chart" aria-label="Pie chart of spending by category" role="img"></canvas>
          </div>
          <p id="chart-empty" class="empty-state">Add a transaction to see your spending chart.</p>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="js/script.js"></script>
</body>
</html>
